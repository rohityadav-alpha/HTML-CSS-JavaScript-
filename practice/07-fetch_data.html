<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f4f6f9;
    }
    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      background: white;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px 14px;
      text-align: left;
    }
    th {
      background-color: #28a745;
      color: white;
    }
    button {
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #Loader-Status {
      color: #666;
      font-style: italic;
      display: "loading";
    }
    </style>
</head>
<body>
    <h1>DATA TABLE</h1>
    <button onclick="fatchData()" >click for data load</button>
    <p id="Loader-Status" >Fatch Data from server</p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Task Title</th>
                <th>Completed?</th>
            </tr>
        </thead>
        <tbody id="table-body">

        </tbody>
    </table>
    <script>
        async function fatchData(){
            const loader=document.getElementById("Loader-Status");
            const tbody=document.getElementById("table-body");
            loader.innerText="loading";
            tbody.innerHTML="";
            const response=await fetch("https://jsonplaceholder.typicode.com/todos?_limit=6");
            const apiData=await response.json();
            loader.innerText="Data Loading complete";
            

            for (let i=0;i<apiData.length;i++){
                const item=apiData[i]
                const row=`<tr>
                            <td>${item.id}</td>
                            <td>${item.title}</td>
                            <td>${item.completed ? "Yes ✅" : "No ❌"}</td>
                           </tr>`;
                tbody.innerHTML+=row;
            }
        }
    </script>
</body>
</html>

            //solution 2
            function DataLoad(filterType) {
                const tbody = document.getElementById("table-body");
                tbody.innerHTML = "";
              
                for (let i = 0; i < Alldata.length; i++) {
                  const item = Alldata[i];
                  const isPass = item.marks >= 35;
              
                  // Filter check
                  if (filterType === "Pass" && !isPass) continue;
                  if (filterType === "Fail" && isPass) continue;
              
                  const statusClass = isPass ? "Pass" : "Fail"; //turnary operators ka use kiya hai 
                  const statusText = isPass ? "Pass" : "Fail";
              
                  tbody.innerHTML += `<tr>
                    <td>${item.subject}</td>
                    <td>${item.marks}</td>
                    <td class="${statusClass}">${statusText}</td>
                  </tr>`;
                }
            }
